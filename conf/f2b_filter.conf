# Rendered by open_notebook_configure() from conf/f2b_filter.conf.
#
# open-notebook answers 401 to any API request carrying a missing or wrong
# Bearer token. Such a request is only reachable after passing SSOwat, so the
# jail covers the app's own shared password, not the YunoHost account.
[INCLUDES]
before = common.conf

[Definition]
failregex = __FAILREGEX__
ignoreregex =
