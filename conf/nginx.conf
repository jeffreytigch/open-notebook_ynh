# open-notebook reverse-proxy configuration.
#
# The Next.js frontend is built with basePath = __PATH__, so the URL prefix must
# be forwarded unchanged (proxy_pass WITHOUT a trailing slash).
#
# API calls are proxied straight to the FastAPI backend (not through the Next.js
# rewrite) so that Server-Sent Events (chat / Ask streaming) are not buffered.

#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

location __PATH__/api/ {
    proxy_pass http://127.0.0.1:__PORT_API__/api/;

    include proxy_params_with_auth;

    # Streaming (SSE) friendly.
    # proxy_http_version is already set by proxy_params_with_auth (setting it
    # again is a fatal "directive is duplicate" error for nginx).
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    chunked_transfer_encoding on;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Must stay in sync with OPEN_NOTEBOOK_MAX_UPLOAD_SIZE_MB
    client_max_body_size __MAX_UPLOAD_SIZE__m;
}

location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__;

    include proxy_params_with_auth;

    # proxy_http_version is already set by proxy_params_with_auth.
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    client_max_body_size __MAX_UPLOAD_SIZE__m;
}
