# Rendered by open_notebook_configure() from conf/f2b_jail.conf.
#
# maxretry is deliberately 20 rather than the usual 5: the frontend issues
# several API calls at once, so a user whose stored password went stale (for
# example right after it was changed in the config panel) can generate a
# handful of 401s in a single page load without doing anything wrong.
[__APP__]
enabled = true
port = http,https
filter = __APP__
logpath = __LOGPATH__
maxretry = 20
findtime = 10m
bantime = 10m
